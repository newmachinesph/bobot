services:
  bobot-agent:
    build: .
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - bot-data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; assert pathlib.Path('/app/data/bot.db').exists()"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  bot-data:

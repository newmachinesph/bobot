[project]
name = "bobot-ph"
version = "0.1.0"
description = "The world's first open-source AI + Human collaborative civic platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "bcrypt>=4.2.0",
    "httpx>=0.28.0",
    "upstash-redis>=1.6.0",
    "boto3>=1.36.0",
    "python-multipart>=0.0.22",
    "email-validator>=2.3.0",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.35.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
